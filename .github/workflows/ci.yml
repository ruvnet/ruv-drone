name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --verbose
      - run: cargo test --locked --verbose
      - run: cargo test --locked --features latentmesh --verbose
      - run: cargo test --locked --features ruforecast --all-targets --verbose
      - run: cargo test --locked --features latentmesh,ruforecast --all-targets --verbose
      - run: cargo clippy --locked --features latentmesh,ruforecast --all-targets -- -D warnings
