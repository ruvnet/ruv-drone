[workspace]
# Root package (ruview-swarm) is the implicit workspace root; ruv-jellyfish
# (ADR-172) is a standalone member with no path-dep back into the root, so it
# builds and tests independently in the light default configuration.
members = ["crates/ruv-jellyfish"]

[package]
name = "ruview-swarm"
version = "0.1.0"
edition = "2021"
description = "Industrial cooperative-UAV coordination — formation keeping, collision avoidance, Raft consensus, cooperative task allocation, MAPPO navigation (ADR-148)"
license = "Apache-2.0"
# Publishing disabled until: (1) PR #862 merges, (2) internal path-deps are
# published in dependency order. Flip to true deliberately.
# Scope is industrial/cooperative (formation keeping, collision avoidance,
# cooperative operation) — NOT adaptive threat/mission-response swarming. See NOTICE.
publish = false

[features]
default = []
# Compatibility placeholder: source implements local MAVLink message/signing
# types but does not reference the optional external `mavlink` crate. Keep the
# feature name stable without resolving its vulnerable generator dependency.
mavlink = []
ros2-dds = []
onnx = ["dep:ort"]
simulation = []
demo = ["simulation"]
full = ["mavlink", "onnx", "demo", "latentmesh"]
ruflo = ["dep:reqwest", "dep:serde_json"]
# Deterministic LatentMesh Air semantic state transport. Pinned to an audited
# upstream commit so the cross-repository wire contract cannot drift silently.
latentmesh = ["dep:latentmesh-air-core", "dep:ed25519-dalek"]
# Heavy GPU-capable MARL training (real Candle autodiff PPO). Off by default so
# the default build stays light and the existing test suite keeps passing.
train = ["dep:candle-core", "dep:candle-nn"]
cuda = ["candle-core/cuda", "candle-nn/cuda"]

[dependencies]
# (no internal path deps — standalone repo; the former wifi-densepose-core dep was unused)

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", optional = true }
toml = "0.8"

# Async runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# ONNX Runtime (optional — for MARL actor inference)
ort = { version = "2.0.0-rc.11", optional = true }

# Candle 0.9 — real autodiff PPO training (optional, behind `train` feature).
candle-core = { version = "0.9", default-features = false, optional = true }
candle-nn   = { version = "0.9", default-features = false, optional = true }

# HTTP client (optional — for Ruflo HTTP backend)
reqwest = { version = "0.12", features = ["json"], optional = true }

# Crypto — MAVLink v2 HMAC-SHA256 signing
hmac = "0.12"
sha2 = "0.10"
ed25519-dalek = { version = "2", default-features = false, features = ["std"], optional = true }
latentmesh-air-core = { git = "https://github.com/ruvnet/LatentMesh.git", rev = "1ff7332c17798eec3b42da5c6f1c271f355fa806", optional = true }

# Error handling
thiserror = "2.0"

# Logging
tracing = "0.1"

# Numerics
nalgebra = "0.33"
rand = "0.8"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tokio-test = "0.4"

[[bench]]
name = "swarm_bench"
harness = false

[[bench]]
name = "latentmesh_bench"
harness = false
required-features = ["latentmesh"]

[[example]]
name = "latentmesh_loopback"
required-features = ["latentmesh"]

# MARL training binary — requires the `train` feature (Candle autodiff).
# Excluded from the default build so `cargo test`/CI stay light.
[[bin]]
name = "train_marl"
required-features = ["train"]

# ADR-171 Stage-1 evaluation CLI — pure Rust, no special feature needed.
[[bin]]
name = "eval_swarm"
